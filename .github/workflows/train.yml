name: Train Model

on:
  push:
    branches:
      - main

jobs:
  train:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install mlflow pandas numpy scikit-learn

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run .
