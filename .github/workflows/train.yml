name: CI - Training Model

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow

      - name: Jalankan MLflow Project
        run: mlflow run MLProject --env-manager=local --experiment-name Energy_Consumption

      - name: Upload artefak (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: hasil-training
          path: |
            mlflow.db
            mlruns
            mlartifacts
          if-no-files-found: ignore

      - name: Simpan artefak ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in mlflow.db mlruns mlartifacts; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet || git commit -m "chore: simpan artefak hasil training"
          git push
