name: CI - Training Model

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
  IMAGE_NAME: energy-model

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==3.13.0 pandas numpy scikit-learn matplotlib

      - name: Bersihkan hasil lama
        run: rm -rf mlflow.db mlruns mlartifacts

      - name: Jalankan MLflow Project
        run: mlflow run MLProject --env-manager=local --experiment-name Energy_Consumption

      - name: Build Docker image dari model
        run: |
          RUN_ID=$(tr -d '[:space:]' < MLProject/run_id.txt)
          echo "Run ID: $RUN_ID"
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "$IMAGE_NAME"

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag dan push image
        run: |
          docker tag "$IMAGE_NAME" "${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME" "${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ github.run_number }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ github.run_number }}"

      - name: Upload artefak (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: hasil-training
          path: |
            mlflow.db
            mlruns
            mlartifacts
          if-no-files-found: ignore

      - name: Simpan artefak ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in mlflow.db mlruns mlartifacts; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet || git commit -m "chore: simpan artefak hasil training"
          git push
